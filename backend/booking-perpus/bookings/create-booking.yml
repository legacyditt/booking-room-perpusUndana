info:
  name: Create Booking
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/bookings"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "roomId": 1,
        "sessionId": 1,
        "date": "2026-09-10",
        "type": "SEAT"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Membuat pemesanan baru. Mendukung dua bentuk payload:

  **1. Reguler (SEAT) — 1 hari + 1 sesi, langsung disetujui (APPROVED):**
  - `roomId` (number, required)
  - `type` (string) = `"SEAT"`
  - `date` (string, `yyyy-MM-dd`, required)
  - `sessionId` (number, required)
  ```json
  { "roomId": 1, "sessionId": 1, "date": "2026-09-10", "type": "SEAT" }
  ```

  **2. Sewa ruangan (ROOM) — 1 hari ATAU range hari kerja kontigu, butuh
  persetujuan admin (PENDING):**
  - `roomId` (number, required)
  - `type` (string) = `"ROOM"`
  - `startDate` (string, `yyyy-MM-dd`, required) — tanggal pertama
  - `endDate` (string, `yyyy-MM-dd`, optional) — tanggal terakhir; jika
    dikosongkan berlaku sewa 1 hari. `sessionId` TIDAK boleh dikirim.
  ```json
  { "roomId": 1, "type": "ROOM", "startDate": "2026-09-07", "endDate": "2026-09-11" }
  ```
  Range = N row terpisah di database (satu row per tanggal), dikembalikan
  sebagai array. Semua tanggal harus hari kerja; range tidak boleh memotong
  hari non-kerja.

  Hanya ruangan dengan `bookingPrice` (price != 0) yang tersedia untuk sewa
  (ROOM).

  **Response 201 (SEAT):**
  ```json
  {
    "message": "Booking created successfully",
    "data": {
      "id": 21,
      "roomId": 1,
      "sessionId": 1,
      "userId": "u_abc",
      "date": "2026-09-10T00:00:00.000Z",
      "status": "APPROVED",
      "type": "SEAT",
      "session": { "id": 1, "name": "Pagi", "startTime": "08:00", "finishTime": "12:00" }
    }
  }
  ```

  **Response 201 (ROOM range = array):**
  ```json
  {
    "message": "Booking created successfully",
    "data": [
      { "id": 22, "roomId": 1, "sessionId": null, "status": "PENDING", "type": "ROOM", "date": "2026-09-07T00:00:00.000Z" },
      { "id": 23, "roomId": 1, "sessionId": null, "status": "PENDING", "type": "ROOM", "date": "2026-09-08T00:00:00.000Z" }
    ]
  }
  ```

  **Response 400 (bentrok / bukan hari kerja / ruangan tidak bisa disewa):**
  ```json
  { "message": "Tanggal pemesanan harus hari kerja dan tidak boleh melewati hari non-kerja" }
  ```