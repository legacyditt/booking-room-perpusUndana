info:
  name: Delete Room
  type: http
  seq: 5

docs: |-
  Menghapus ruangan berdasarkan ID.

  **Path Parameters:**
  - `id` (number, required) — ID ruangan.

  **Response 200:**
  ```json
  {
    "message": "Room Deleted Successfully",
    "data": {
      "id": 1,
      "name": "Ruang Archibald",
      "capacity": 2,
      "imageUrl": "/rooms/archibald.jpg"
    }
  }
  ```

http:
  method: DELETE
  url: "{{baseUrl}}/rooms/1"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
