info:
  name: Create Room
  type: http
  seq: 1

http:
  method: POST
  url: "{{baseUrl}}/rooms"
  headers:
    - name: Content-Type
      value: application/json
  body:
    type: json
    data: |-
      {
        "name": "Ruang Baru",
        "capacity": 6,
        "imageUrl": "/rooms/baru.jpg"
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Membuat ruangan baru.

  **Request Body (application/json):**
  - `name` (string, required)
  - `capacity` (number, required)
  - `imageUrl` (string, required)

  **Response 201:**
  ```json
  {
    "messsage": "Room Created Successfully",
    "data": {
      "id": 5,
      "name": "Ruang Baru",
      "capacity": 6,
      "imageUrl": "/rooms/baru.jpg"
    }
  }
  ```
