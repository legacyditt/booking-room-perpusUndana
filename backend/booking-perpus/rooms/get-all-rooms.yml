info:
  name: Get All Rooms
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/rooms"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Mengambil daftar semua ruangan beserta harga booking-nya.

  **Response 200:**
  ```json
  {
    "data": [
      {
        "id": 1,
        "name": "Ruang Archibald",
        "capacity": 2,
        "imageUrl": "/rooms/archibald.jpg",
        "bookingPrice": { "roomId": 1, "price": "15" }
      }
    ]
  }
  ```
